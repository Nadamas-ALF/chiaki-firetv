name: Build Chiaki Fire TV

on:
  push:
    branches: [ firetv ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          pip install "protobuf==3.20.3"

      - name: NDK y CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;23.1.7779620" "cmake;3.22.1" "platforms;android-33" "build-tools;30.0.3"

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          APK=$(find app/build/outputs -name "*.apk" | head -1)
          echo "APK: $APK"
          cp "$APK" ../chiaki-firetv.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firetv-build
          name: Chiaki Fire TV
          target_commitish: firetv
          files: chiaki-firetv.apk
          make_latest: true
